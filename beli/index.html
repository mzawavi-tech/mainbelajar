<!doctype html>
<html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Beli MainBelajar</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff7e0;color:#3b2a14;font-family:"Trebuchet MS",system-ui,sans-serif}
.w{max-width:440px;margin:0 auto;padding:22px 16px 40px}h1{color:#ff8a3d;text-align:center;margin:6px 0}
.card{background:#fff;border-radius:22px;padding:18px;box-shadow:0 5px 0 #0002;margin-bottom:14px}
label{display:block;font-weight:800;margin:12px 0 4px}input,select{width:100%;font:inherit;font-size:17px;padding:12px;border-radius:12px;border:3px solid #0002}
.btn{display:block;width:100%;border:0;border-radius:18px;padding:15px;font:inherit;font-weight:900;font-size:19px;color:#fff;background:#4cc26b;box-shadow:0 4px 0 #0003;margin-top:16px}
.msg{text-align:center;font-weight:700;margin-top:10px;color:#c92a2a}a{color:#3db8ff}
</style></head><body><div class="w">
<h1>MainBelajar 🎓</h1>
<div id="thanks" class="card" style="display:none;text-align:center">
<div style="font-size:60px">🎉</div><h2>Terima kasih!</h2>
<p>Jika pembayaran berjaya, <b>kod anda dihantar ke emel</b> dalam beberapa minit. Semak juga folder Spam/Promosi.</p>
<p><a href="../">Pergi ke game</a></p></div>
<div id="form" class="card">
<label>Pilih pakej</label>
<select id="p"><option value="all">Bundle 10 game - RM49</option>
<option value="kira">Jom Kira - RM12</option><option value="sifir">Jom Sifir - RM12</option><option value="baca">Jom Baca - RM12</option>
<option value="lukis">Lukis Ajaib - RM12</option><option value="puzzle">Puzzle Geng Comel - RM12</option><option value="pecahan">Jom Pecahan - RM12</option>
<option value="duit">Duit Pandai - RM12</option><option value="bahasa">Bahasa Hebat - RM12</option><option value="sains">Sains Seronok - RM12</option><option value="words">Word Power - RM12</option></select>
<label>Nama</label><input id="n" autocomplete="name">
<label>Emel (kod dihantar ke sini)</label><input id="e" type="email" autocomplete="email">
<label>No. WhatsApp</label><input id="t" type="tel" autocomplete="tel" placeholder="01xxxxxxxx">
<button class="btn" id="go">Bayar (FPX / Kad)</button><div class="msg" id="m"></div></div>
</div>
<script>
var API="https://GANTI-PROJECT.supabase.co/functions/v1/create-bill"; // diisi selepas deploy
var q=new URLSearchParams(location.search);
if(q.get("thanks")){ document.getElementById("thanks").style.display="block"; document.getElementById("form").style.display="none"; }
if(q.get("p")) document.getElementById("p").value=q.get("p");
document.getElementById("go").onclick=function(){
  var m=document.getElementById("m"), b=this; m.textContent="";
  var d={product:p.value,name:n.value.trim(),email:e.value.trim(),phone:t.value.trim()};
  if(!d.name||!/^\S+@\S+\.\S+$/.test(d.email)){ m.textContent="Sila isi nama dan emel yang betul."; return; }
  b.disabled=true; b.textContent="Sila tunggu...";
  fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(d)}).then(function(r){return r.json();})
   .then(function(j){ if(j.ok) location.href=j.url; else { m.textContent=j.message||"Ralat."; b.disabled=false; b.textContent="Bayar (FPX / Kad)"; } })
   .catch(function(){ m.textContent="Tiada internet. Cuba lagi."; b.disabled=false; b.textContent="Bayar (FPX / Kad)"; });
};
</script></body></html>
