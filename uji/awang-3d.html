<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="robots" content="noindex">
<title>Awang 3D (versi kod)</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#f6e6da;font-family:"Trebuchet MS",system-ui,sans-serif;color:#3b2a14}
canvas{display:block;width:100%;height:100%;touch-action:none}
#t{position:fixed;top:10px;left:0;right:0;text-align:center;pointer-events:none}
#t b{font-size:22px;color:#8b1538}#t span{display:block;font-size:14px;font-weight:700;opacity:.75}
#bar{position:fixed;left:0;right:0;bottom:12px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:0 8px}
button{border:0;border-radius:16px;padding:12px 16px;font:inherit;font-size:17px;font-weight:900;background:#ffd23d;color:#3b2a14;box-shadow:0 4px 0 #0003}
button.on{background:#8b1538;color:#fff}button:active{transform:translateY(2px)}
</style>
</head>
<body>
<div id="t"><b>Awang 3D</b><span>Dibina sepenuhnya dengan kod. Seret untuk pusing.</span></div>
<div id="bar">
<button data-a="silat" class="on">🥋 Silat</button><button data-a="lambai">👋 Lambai</button><button data-a="lompat">🤸 Lompat</button>
<button data-a="jalan">🚶 Jalan</button><button data-a="bagus">👍 Bagus</button><button data-a="cakap">💬 Cakap</button><button data-a="pusing">🔄 Pusing</button>
</div>
<script type="module" src="awang-3d.js"></script>
</body>
</html>
